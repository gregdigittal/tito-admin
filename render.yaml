# Render: Tito Admin UI (Laravel + Livewire)
# Connect this repo and create a Web Service; override build/start if needed.
services:
  - type: web
    name: tito-admin
    runtime: php
    buildCommand: "composer install --no-dev --optimize-autoloader && npm ci && npm run build"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: TITO_API_URL
        sync: false
      - key: APP_KEY
        generateValue: true
